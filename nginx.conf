server {
    listen 6000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

    # Static website
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML
    location = /index.html {
        expires -1;
    }

    # Application version
    location = /version.json {
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }

    # Hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Images
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}